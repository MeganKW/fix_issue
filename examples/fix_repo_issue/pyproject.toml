[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fix_repo_issue"
version = "0.1.0"
description = "A tool to fix repository issues and create pull requests"
authors = []
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
click = "^8.0.0"
pydantic = "^2.0.0"
requests = "^2.31.0"
PyGithub = "^2.1.1"
python-dotenv = "^1.0.0"
jsonschema = "^4.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
mypy = "^1.0.0"
ruff = "^0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.ruff]
select = ["E", "F", "I"]
ignore = []
line-length = 100

[tool.black]
line-length = 100
target-version = ['py39'] 

[tool.poetry.scripts]
fix_repo_issue = "fix_repo_issue:main"
create_task = "create_task:main"

[tool.poetry.plugins.inspect_ai]
fix_repo_issue = "fix_repo_issue:fix_repo_issue"
